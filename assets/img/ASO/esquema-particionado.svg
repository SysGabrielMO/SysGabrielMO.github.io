<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { stroke: #333; stroke-width: 1.5; }
    .lbl { font-size: 14px; fill: #fff; font-weight: bold; }
    .sub { font-size: 11px; fill: #fff; }
    .title { font-size: 16px; fill: #222; font-weight: bold; }
  </style>

  <text x="10" y="25" class="title">Disco de 1 TB (GPT)</text>

  <!-- EFI -->
  <rect x="10" y="45" width="90" height="60" class="box" fill="#4a7c9e"/>
  <text x="20" y="70" class="lbl">EFI</text>
  <text x="20" y="88" class="sub">300 MB</text>

  <!-- boot -->
  <rect x="110" y="45" width="100" height="60" class="box" fill="#5a8fae"/>
  <text x="120" y="70" class="lbl">/boot</text>
  <text x="120" y="88" class="sub">1 GB - ext4</text>

  <!-- LVM PV container -->
  <rect x="220" y="45" width="570" height="330" class="box" fill="none" stroke="#333" stroke-dasharray="6,4"/>
  <text x="230" y="35" class="title">Volumen fisico LVM (PV) -&gt; Grupo de volumenes vg0 (~998 GB)</text>

  <!-- root -->
  <rect x="235" y="60" width="540" height="50" class="box" fill="#3f7d4f"/>
  <text x="245" y="85" class="lbl">root (/)  -  40 GB  -  ext4</text>

  <!-- var -->
  <rect x="235" y="120" width="540" height="60" class="box" fill="#4f8f5f"/>
  <text x="245" y="150" class="lbl">/var  -  80 GB  -  ext4</text>

  <!-- home -->
  <rect x="235" y="190" width="540" height="130" class="box" fill="#5fa070"/>
  <text x="245" y="255" class="lbl">/home  -  700 GB  -  ext4</text>

  <!-- swap -->
  <rect x="235" y="330" width="200" height="40" class="box" fill="#a06a3f"/>
  <text x="245" y="355" class="lbl">swap  -  8 GB</text>

  <!-- free -->
  <rect x="445" y="330" width="330" height="40" class="box" fill="#999" stroke-dasharray="3,3"/>
  <text x="455" y="355" class="lbl">Libre sin asignar (~170 GB) - reserva</text>
</svg>
