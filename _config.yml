title: Cuaderno de prácticas
subtitulo: Segundo curso de ASIR — I.E.S. Gonzalo Nazareno
autor: Gabriel
curso: "2026 / 2027"
url: "https://SysGabrielMO.github.io"

# Cada fichero de _practicas se publica como una página propia.
collections:
  practicas:
    output: true
    permalink: /practicas/:path/

# Así no hace falta repetir "layout" en cada práctica.
defaults:
  - scope:
      path: ""
      type: practicas
    values:
      layout: practica

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - LEEME.md
