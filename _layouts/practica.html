---
layout: default
---
{% assign asig = site.data.asignaturas | where: "codigo", page.asignatura | first %}
<article class="practica">

  <p class="volver"><a href="{{ '/' | relative_url }}">Volver al índice</a></p>

  <h1>{{ page.title }}</h1>
  <p class="ficha">
    <span>{% if asig %}{{ asig.nombre }}{% else %}{{ page.asignatura }}{% endif %}</span>
    {% if page.date %}<time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%d/%m/%Y" }}</time>{% endif %}
  </p>

  {{ content }}

</article>
