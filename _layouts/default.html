<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.descripcion }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/estilo.css' | relative_url }}">
</head>
<body>

  <nav class="barra">
    <div class="contenedor barra-interior">
      <a class="barra-marca" href="{{ '/' | relative_url }}">{{ site.titulo_corto }}</a>
      <ul class="barra-enlaces">
        <li><a href="{{ '/' | relative_url }}">Inicio</a></li>
        <li><a href="{{ '/asignaturas/' | relative_url }}">Asignaturas</a></li>
        <li><a href="https://github.com/{{ site.github_usuario }}">GitHub</a></li>
      </ul>
    </div>
  </nav>

  {{ content }}

  <footer class="pie">
    <div class="contenedor pie-interior">
      <p>{{ site.title }} · {{ site.centro }} · Curso {{ site.curso }}</p>
      <p><a href="https://github.com/{{ site.github_usuario }}">github.com/{{ site.github_usuario }}</a></p>
    </div>
  </footer>

</body>
</html>
